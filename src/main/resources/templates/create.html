<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Créer Produit - VINA AKOHO</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="vina-body">
<div id="vina-sidebar"></div>
<div class="app-main-wrapper"><div id="vina-header"></div>
<div id="vina-content">

<section class="page-header theme-blue">
<div>
<p class="eyebrow">GESTION PRODUITS</p>
<h1>Créer un Nouveau Produit</h1>
<p>Enregistrez un nouveau produit dans le catalogue avec ses caractéristiques complètes.</p>
</div>
</section>

<!-- Formulaire de création -->
<section class="form-section">
<h2>Informations Générales</h2>
<form onsubmit="alert('Produit créé avec succès'); return false;">
<div class="form-grid">
<div class="form-group">
<label for="nom-produit">Nom du Produit</label>
<input type="text" id="nom-produit" class="form-control" placeholder="Nom complet du produit" required>
</div>
<div class="form-group">
<label for="code-produit">Code Produit</label>
<input type="text" id="code-produit" class="form-control" placeholder="PROD-XXX" required>
</div>
<div class="form-group">
<label for="categorie">Catégorie</label>
<select id="categorie" class="form-control" required>
<option value="">Sélectionner une catégorie...</option>
<option value="aliment">Aliment</option>
<option value="farine">Farine</option>
<option value="premix">Prémix</option>
<option value="supplement">Supplément</option>
</select>
</div>
<div class="form-group">
<label for="description">Description</label>
<textarea id="description" class="form-control" rows="3" placeholder="Description détaillée du produit"></textarea>
</div>
</div>

<h2>Caractéristiques Techniques</h2>
<div class="form-grid">
<div class="form-group">
<label for="poids-unite">Poids Unitaire (kg)</label>
<input type="number" id="poids-unite" class="form-control" placeholder="0.00" step="0.01" required>
</div>
<div class="form-group">
<label for="prix-coutant">Prix Coûtant (Ar)</label>
<input type="number" id="prix-coutant" class="form-control" placeholder="0.00" step="0.01" required>
</div>
<div class="form-group">
<label for="prix-vente">Prix de Vente (Ar)</label>
<input type="number" id="prix-vente" class="form-control" placeholder="0.00" step="0.01" required>
</div>
<div class="form-group">
<label for="unite">Unité de Vente</label>
<select id="unite" class="form-control" required>
<option value="">Sélectionner...</option>
<option value="sac">Sac</option>
<option value="kg">Kilogramme</option>
<option value="litre">Litre</option>
<option value="unite">Unité</option>
</select>
</div>
</div>

<h2>Composition</h2>
<div class="form-group">
<label for="ingredients">Ingrédients Principaux</label>
<textarea id="ingredients" class="form-control" rows="3" placeholder="Liste des ingrédients principaux..."></textarea>
</div>
<div class="form-group">
<label for="normes">Normes et Certifications</label>
<textarea id="normes" class="form-control" rows="3" placeholder="Bio, Halal, Normes ISO, etc..."></textarea>
</div>

<h2>Conditions de Stockage</h2>
<div class="form-grid">
<div class="form-group">
<label for="temp-min">Température Min (°C)</label>
<input type="number" id="temp-min" class="form-control" placeholder="Ex: 15" step="0.1">
</div>
<div class="form-group">
<label for="temp-max">Température Max (°C)</label>
<input type="number" id="temp-max" class="form-control" placeholder="Ex: 25" step="0.1">
</div>
<div class="form-group">
<label for="humidite">Humidité Relative (%)</label>
<input type="number" id="humidite" class="form-control" placeholder="Ex: 60" min="0" max="100">
</div>
<div class="form-group">
<label for="zone-stockage">Zone Stockage Recommandée</label>
<select id="zone-stockage" class="form-control">
<option value="">Sélectionner...</option>
<option value="zone-a">Zone A (Climatisée)</option>
<option value="zone-b">Zone B (Ambiant)</option>
<option value="zone-c">Zone C (Sec)</option>
</select>
</div>
</div>

<div class="form-actions">
<button type="submit" class="btn btn-primary btn-large">Créer le Produit</button>
<button type="reset" class="btn btn-ghost btn-large">Réinitialiser</button>
<a href="produit/produits.html" class="btn btn-info btn-large">Voir Catalogue</a>
</div>
</form>
</section>

<div id="vina-footer"></div>
</div>

<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app-shell.js"></script>
<script>
window.VinaAkohoAuth.enforceModuleAccess('create.html');
</script>
</div>
</body>
</html>
