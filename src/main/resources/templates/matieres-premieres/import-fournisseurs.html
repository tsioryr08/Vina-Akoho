<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Import Fournisseurs - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}" />
  </head>
  <body class="vina-body">
  <div th:replace="${sidebarTemplate} :: sidebar"></div>
    <div class="app-main-wrapper">
      <header th:replace="~{layout/header :: header('Fourniseurs')}"></header>
      <div id="vina-content">
        <section class="page-header theme-orange">
          <div>
            <p class="eyebrow">FOURNISSEURS</p>
            <h1>Import en masse</h1>
            <p class="muted-text">Importer plusieurs fournisseurs depuis un fichier Excel.</p>
          </div>
        </section>

        <div th:replace="~{layout/fragment-import-excel :: formulaireImport('formImportFournisseur', 'inputFichierFournisseur', 'resultatImportFournisseur', @{/api/fournisseurs/import/modele})}"></div>
      </div>
    </div>

    <script th:src="@{/js/import-excel.js}"></script>
    <script th:inline="javascript">
      initImportExcel({
        urlApercu: /*[[@{/api/fournisseurs/import/apercu}]]*/ "",
        urlImport: /*[[@{/api/fournisseurs/import}]]*/ "",
        inputFileId: "inputFichierFournisseur",
        formId: "formImportFournisseur",
        resultatContainerId: "resultatImportFournisseur",
      });
    </script>
  </body>
</html>
