<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar-livraison" class="sidebar" id="vina-sidebar">
  <div class="sidebar-brand">
    <img th:src="@{/static/VINA_AKOHO_LOGO.png}" alt="VINA AKOHO" class="brand-mark" />
    <div>
      <div class="brand-title">VINA AKOHO</div>
      <div class="brand-subtitle" th:text="${currentUser != null ? currentUser.role.poste : '}">RO</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Menu</div>
    <a class="sidebar-link" th:href="@{/api/livraisons}">Liste livraisons <span class="sidebar-code">L1</span></a>
    <a class="sidebar-link" th:href="@{/api/livraisons/nouvelle}">Nouvelle livraison <span class="sidebar-code">L2</span></a>
    <a class="sidebar-link" th:href="@{/api/livraisons/historique}">Historique <span class="sidebar-code">L3</span></a>

    <div class="sidebar-section">Documents livraison</div>
    <div th:if="${fichiersLivraison == null || fichiersLivraison.isEmpty()}" style="padding: 8px 16px; color: var(--muted); font-size: 13px;">
      Aucun fichier
    </div>
    <div th:each="fichier : ${fichiersLivraison}">
      <a class="sidebar-link" th:href="${fichier.url}" target="_blank" rel="noopener">
        <span style="margin-right:6px;">📄</span>
        <span th:text="${fichier.nom}">document.pdf</span>
      </a>
    </div>
  </nav>
</aside>
</body>
</html>
