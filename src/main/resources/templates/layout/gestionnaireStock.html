<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>

    <div>

      <div class="brand-subtitle" th:text="${currentUser != null ? currentUser.role.poste : ''}">RO03</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Principal</div>
    <a class="sidebar-link" th:href="@{/api/stock}">Dashboard <span class="sidebar-code">F9</span></a>
