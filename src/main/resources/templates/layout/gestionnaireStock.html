<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" id="vina-sidebar">
  <div class="sidebar-brand">
    <img th:src="@{/images/VINA_AKOHO_LOGO.png}" alt="VINA AKOHO" class="brand-mark" />
    <div>
      <div class="brand-title">VINA AKOHO</div>
      <div class="brand-subtitle" th:text="${currentUser != null ? currentUser.role.poste : ''}">RO03</div>
    </div>
  </div>

  <div class="sidebar-intro">
    <div class="sidebar-intro-title">Navigation rapide</div>
    <p class="sidebar-intro-text">Surveillance des stocks, lots et alertes de rupture.</p>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Principal</div>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Dashboard</span> <span class="sidebar-code">F9</span></a>
    <div class="sidebar-section">Mouvements et Lot</div>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Mouvements Stocks</span> <span class="sidebar-code">S1</span></a>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Gestion Lots &amp; Peremptions</span> <span class="sidebar-code">S2</span></a>
    <div class="sidebar-section">Surveillance</div>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/alertes}"><span class="sidebar-link-label">Alertes de Seuil</span> <span class="sidebar-code">S3</span></a>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Inventaire Periodique</span> <span class="sidebar-code">S4</span></a>
    <div class="sidebar-section">Reporting</div>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Rapport de Stock</span> <span class="sidebar-code">S5</span></a>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Suggestions Promotions</span></a>
  </nav>
</aside>
</body>
</html>
