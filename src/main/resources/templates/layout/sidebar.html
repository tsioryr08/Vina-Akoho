<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" id="vina-sidebar">
  <div class="sidebar-brand">
    <img th:src="@{/static/VINA_AKOHO_LOGO.png}" alt="VINA AKOHO" class="brand-mark" />
    <div>
      <div class="brand-title">VINA AKOHO</div>
      <div class="brand-subtitle" th:text="${currentUser != null ? currentUser.role.poste : ''}">RO01</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Matieres Premieres</div>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/nouveau}">Ajouter Matieres <span class="sidebar-code">M1</span></a>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres}">Suivi Stock Matieres <span class="sidebar-code">M2</span></a>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/fiche}">Creer Fiche Produit <span class="sidebar-code">M3</span></a>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/alertes}">Suggestions <span class="sidebar-code">M4</span></a>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/previsions}">Previsions <span class="sidebar-code">M5</span></a>
    <a class="sidebar-link" th:href="@{/api/produits}">Suivi Produits Finis <span class="sidebar-code">P1</span></a>
    <a class="sidebar-link" th:href="@{/api/produits/nouveau}">Ajouter Produit <span class="sidebar-code">P2</span></a>
    <a class="sidebar-link" th:href="@{/api/produits/detail}">Details Produits Finis <span class="sidebar-code">P3</span></a>
  </nav>
</aside>
</body>
</html>
