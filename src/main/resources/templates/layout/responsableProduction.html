<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar" class="sidebar" id="vina-sidebar">
  <div class="sidebar-brand">
    <img th:src="@{/images/VINA_AKOHO_LOGO.png}" alt="VINA AKOHO" class="brand-mark" />
    <div>
      <div class="brand-title">VINA AKOHO</div>
      <div class="brand-subtitle" th:text="${currentUser != null ? currentUser.role.poste : ''}">RO02</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <div class="sidebar-section">Principal</div>
    <a class="sidebar-link" th:href="@{/api/production}"><span class="sidebar-link-label">Dashboard</span> <span class="sidebar-code">F10</span></a>
    <div class="sidebar-section">Matieres Premieres</div>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/nouveau}"><span class="sidebar-link-label">Ajouter Matieres</span> <span class="sidebar-code">M1</span></a>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres}"><span class="sidebar-link-label">Suivi Stock Matieres</span> <span class="sidebar-code">M2</span></a>    
    <a class="sidebar-link" th:href="@{/api/categories}"><span class="sidebar-link-label">Gerer les recettes</span> <span class="sidebar-code">R1</span></a>
    <div class="sidebar-section">Production</div>
    <a class="sidebar-link" th:href="@{/api/production/entree-produit}"><span class="sidebar-link-label">Entree Produit</span> <span class="sidebar-code">S2</span></a>
    <a class="sidebar-link" th:href="@{/api/production/historique}"><span class="sidebar-link-label">Historique productions</span> <span class="sidebar-code">S2B</span></a>
    <div class="sidebar-section">Stocks</div>
    <a class="sidebar-link" th:href="@{/api/produits}"><span class="sidebar-link-label">Suivi Produits Finis</span> <span class="sidebar-code">S1</span></a>
    <div class="sidebar-section">Surveillance</div>
    <a class="sidebar-link" th:href="@{/api/matieres-premieres/alertes}"><span class="sidebar-link-label">Alertes de Seuil</span> <span class="sidebar-code">S3</span></a>
    <a class="sidebar-link" th:href="@{/api/stock}"><span class="sidebar-link-label">Inventaire Periodique</span> <span class="sidebar-code">S4</span></a>
  </nav>
</aside>
</body>
</html>
