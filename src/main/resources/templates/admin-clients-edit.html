<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditer Client - Admin - VINA AKOHO</title>
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="vina-body">

<aside id="vina-sidebar"></aside>
<div id="vina-header"></div>

<div id="vina-content">
<div class="page-header theme-purple">
<h1>Éditer Client</h1>
</div>

<form id="clientEditForm" class="form-page">
<!-- Infos Générales -->
<section class="form-section">
<h2>Informations Générales</h2>
<div class="form-grid">
<div class="form-group">
<label for="clientName" class="form-label">Nom du client *</label>
<input type="text" id="clientName" name="clientName" class="form-control" value="ACME Corporation" required>
</div>
<div class="form-group">
<label for="clientCode" class="form-label">Code client *</label>
<input type="text" id="clientCode" name="clientCode" class="form-control" value="ACME-001" required>
</div>
<div class="form-group">
<label for="socialName" class="form-label">Raison sociale</label>
<input type="text" id="socialName" name="socialName" class="form-control" value="ACME Corp SARL">
</div>
<div class="form-group">
<label for="category" class="form-label">Catégorie *</label>
<select id="category" name="category" class="form-control" required>
<option value="">-- Sélectionner --</option>
<option value="distributeur" selected>Distributeur</option>
<option value="revendeur">Revendeur</option>
<option value="eleveur">Éleveur</option>
<option value="cooperative">Coopérative</option>
<option value="autre">Autre</option>
</select>
</div>
<div class="form-group">
<label for="profileType" class="form-label">Type de profil</label>
<select id="profileType" name="profileType" class="form-control">
<option value="">-- Sélectionner --</option>
<option value="petit-eleveur">Petit Éleveur</option>
<option value="ferme-moyenne">Ferme Moyenne</option>
<option value="cooperative">Coopérative</option>
<option value="revendeur" selected>Revendeur</option>
</select>
</div>
<div class="form-group">
<label for="status" class="form-label">Statut *</label>
<select id="status" name="status" class="form-control" required>
<option value="actif" selected>Actif</option>
<option value="suspendu">Suspendu</option>
<option value="inactif">Inactif</option>
</select>
</div>
</div>
</section>

<!-- Contacts -->
<section class="form-section">
<h2>Contacts</h2>
<div class="form-grid">
<div class="form-group">
<label for="contactName" class="form-label">Responsable *</label>
<input type="text" id="contactName" name="contactName" class="form-control" value="Jean Dupont" required>
</div>
<div class="form-group">
<label for="position" class="form-label">Fonction</label>
<input type="text" id="position" name="position" class="form-control" value="Directeur Opérations">
</div>
<div class="form-group">
<label for="phone1" class="form-label">Téléphone principal *</label>
<input type="tel" id="phone1" name="phone1" class="form-control" value="+226 25 12 34 56" required>
</div>
<div class="form-group">
<label for="phone2" class="form-label">Téléphone secondaire</label>
<input type="tel" id="phone2" name="phone2" class="form-control" value="+226 70 98 76 54">
</div>
<div class="form-group">
<label for="email" class="form-label">Email *</label>
<input type="email" id="email" name="email" class="form-control" value="contact@acme.bf" required>
</div>
<div class="form-group">
<label for="frequency" class="form-label">Fréquence de contact</label>
<select id="frequency" name="frequency" class="form-control">
<option value="">-- Sélectionner --</option>
<option value="hebdomadaire">Hebdomadaire</option>
<option value="mensuel" selected>Mensuel</option>
<option value="trimestriel">Trimestriel</option>
<option value="autre">Autre</option>
</select>
</div>
</div>
</section>

<!-- Adresse -->
<section class="form-section">
<h2>Adresse</h2>
<div class="form-grid">
<div class="form-group">
<label for="street" class="form-label">Rue *</label>
<input type="text" id="street" name="street" class="form-control" value="Avenue du Commerce" required>
</div>
<div class="form-group">
<label for="quarter" class="form-label">Quartier *</label>
<input type="text" id="quarter" name="quarter" class="form-control" value="Zogona" required>
</div>
<div class="form-group">
<label for="city" class="form-label">Ville *</label>
<input type="text" id="city" name="city" class="form-control" value="Ouagadougou" required>
</div>
<div class="form-group">
<label for="postal" class="form-label">Code postal</label>
<input type="text" id="postal" name="postal" class="form-control" value="01 BP 123">
</div>
<div class="form-group">
<label for="province" class="form-label">Province *</label>
<input type="text" id="province" name="province" class="form-control" value="Kadiogo" required>
</div>
</div>
</section>

<!-- Conditions Commerciales -->
<section class="form-section">
<h2>Conditions Commerciales</h2>
<div class="form-grid">
<div class="form-group">
<label for="paymentMode" class="form-label">Mode de paiement *</label>
<select id="paymentMode" name="paymentMode" class="form-control" required>
<option value="">-- Sélectionner --</option>
<option value="comptant">Comptant</option>
<option value="30jours" selected>À 30 jours</option>
<option value="60jours">À 60 jours</option>
<option value="90jours">À 90 jours</option>
</select>
</div>
<div class="form-group">
<label for="paymentDelay" class="form-label">Délai de paiement (jours)</label>
<input type="number" id="paymentDelay" name="paymentDelay" class="form-control" value="30" min="0">
</div>
<div class="form-group">
<label for="discount" class="form-label">Remise (%)</label>
<input type="number" id="discount" name="discount" class="form-control" value="5.00" step="0.01" min="0" max="100">
</div>
<div class="form-group">
<label for="volumeMin" class="form-label">Volume minimum (kg)</label>
<input type="number" id="volumeMin" name="volumeMin" class="form-control" value="100" min="0">
</div>
<div class="form-group">
<label for="creditLimit" class="form-label">Limite de crédit (Ar)</label>
<input type="number" id="creditLimit" name="creditLimit" class="form-control" value="5000000" min="0">
</div>
</div>
</section>

<!-- Zones de Livraison -->
<section class="form-section">
<h2>Zones de Livraison Autorisées</h2>
<div class="form-group">
<label class="form-label">Sélectionnez les zones</label>
<div class="checkbox-group">
<label class="checkbox-option">
<input type="checkbox" name="zones" value="ouagadougou-centre" checked>
Ouagadougou Centre
</label>
<label class="checkbox-option">
<input type="checkbox" name="zones" value="zogona" checked>
Zogona
</label>
<label class="checkbox-option">
<input type="checkbox" name="zones" value="secteur-3" checked>
Secteur 3
</label>
<label class="checkbox-option">
<input type="checkbox" name="zones" value="secteur-30">
Secteur 30
</label>
<label class="checkbox-option">
<input type="checkbox" name="zones" value="kadiogo">
Kadiogo
</label>
</div>
</div>
</section>

<!-- Accès et Permissions -->
<section class="form-section">
<h2>Accès et Permissions</h2>
<div class="form-group">
<label class="form-label">Accès et Services</label>
<div class="checkbox-group">
<label class="checkbox-option">
<input type="checkbox" name="services" value="portail-web" checked>
Accès portail web
</label>
<label class="checkbox-option">
<input type="checkbox" name="services" value="suivi-commandes" checked>
Suivi des commandes en temps réel
</label>
<label class="checkbox-option">
<input type="checkbox" name="services" value="gestion-factures" checked>
Gestion des factures
</label>
<label class="checkbox-option">
<input type="checkbox" name="services" value="export-donnees">
Export de données
</label>
</div>
</div>
</section>

<!-- Observations -->
<section class="form-section">
<h2>Observations</h2>
<div class="form-group">
<label for="notes" class="form-label">Notes internes</label>
<textarea id="notes" name="notes" class="form-control" rows="4">Client fidèle depuis 2022. Bonne solvabilité. Préfère les livraisons le mardi. Contact régulier avec le responsable commercial.</textarea>
</div>
</section>

<!-- Actions -->
<section class="form-section form-actions">
<button type="submit" class="btn btn-primary btn-large">💾 Enregistrer</button>
<a href="admin-clients-detail.html" class="btn btn-ghost btn-large">Annuler</a>
</section>
</form>
            <div id="vina-footer"></div>
        </div>
    </div>
</body>
</html>
