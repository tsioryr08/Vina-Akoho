<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouveau compte client - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="login-page">
    <main class="login-card" aria-labelledby="titre-nouveau-client">
        <section class="login-brand">
            <img class="brand-logo" th:src="@{/assets/VINA_AKOHO_LOGO.png}" alt="Logo VINA AKOHO">
            <div>
                <h1 id="titre-nouveau-client">Nouveau compte</h1>
                <p>Creation d'un compte client</p>
            </div>
        </section>

        <form class="login-form" method="post" th:action="@{/clients/nouveau}" th:object="${inscription}">
            <div class="form-group">
                <label for="nom">Nom</label>
                <input class="form-control" id="nom" th:field="*{nom}" type="text" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="prenom">Prenom</label>
                <input class="form-control" id="prenom" th:field="*{prenom}" type="text" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="numeroTelephone">Numero telephone</label>
                <input class="form-control" id="numeroTelephone" th:field="*{numeroTelephone}" type="tel" maxlength="20" required>
            </div>

            <div class="form-group">
                <label for="adresse">Adresse</label>
                <input class="form-control" id="adresse" th:field="*{adresse}" type="text">
            </div>

            <p class="login-error" aria-live="polite" th:text="${erreur}"></p>
            <p class="login-note" th:if="${succes != null}" th:text="${succes}"></p>

            <div th:if="${client != null}" class="login-note">
                <strong th:text="'Identifiant: ' + ${client.id}"></strong><br>
                <span th:text="${client.prenom} + ' ' + ${client.nom}"></span><br>
                <span th:text="${client.adresse}"></span>
            </div>

            <button class="btn btn-primary btn-full" type="submit">Enregistrer le compte</button>
            <a class="btn btn-white btn-full" th:href="@{/clients/connexion}">Retour connexion</a>
        </form>
    </main>
</body>
</html>
