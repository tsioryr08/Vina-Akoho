<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espace client - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/assets/css/style.css}">
</head>
<body class="login-page">
    <main class="login-card" aria-labelledby="titre-espace-client">
        <section class="login-brand">
            <img class="brand-logo" th:src="@{/assets/VINA_AKOHO_LOGO.png}" alt="Logo VINA AKOHO">
            <div>
                <h1 id="titre-espace-client">Espace client</h1>
                <p th:text="'Bienvenue ' + ${client.prenom} + ' ' + ${client.nom}">Bienvenue</p>
            </div>
        </section>

        <section class="login-form">
            <p class="login-note">Connexion reussie</p>

            <div class="form-group">
                <label>Identifiant client</label>
                <div class="form-control" th:text="${client.id}">1</div>
            </div>

            <div class="form-group">
                <label>Nom complet</label>
                <div class="form-control" th:text="${client.prenom} + ' ' + ${client.nom}">Client</div>
            </div>

            <div class="form-group">
                <label>Numero telephone</label>
                <div class="form-control" th:text="${client.numeroTelephone}">034...</div>
            </div>

            <div class="form-group">
                <label>Adresse</label>
                <div class="form-control" th:text="${client.adresse != null and !client.adresse.isBlank()} ? ${client.adresse} : 'Adresse non renseignee'">Adresse</div>
            </div>

            <a class="btn btn-white btn-full" th:href="@{/clients/connexion}">Se deconnecter</a>
        </section>
    </main>
</body>
</html>
