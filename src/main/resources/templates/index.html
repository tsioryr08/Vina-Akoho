<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINA AKOHO - Connexion</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-page">
<section class="login-card">
<div class="login-brand">
<img src="assets/VINA_AKOHO_LOGO.png" alt="VINA AKOHO" class="brand-logo">
<div>
<h1>VINA AKOHO</h1>
<p>Production et livraison d’aliments pour poulets</p>
</div>
</div>

<form id="loginForm" class="login-form" action="api/login" method="post" autocomplete="off">
<div class="form-group">
  <label for="employeSelect">Employé</label>
  <select id="employeSelect" name="email" class="form-control" required>
    <option value="" disabled selected>-- Sélectionner votre nom --</option>
    <option th:each="e : ${employes}" th:value="${e.email}" th:text="${e.nom + ' ' + e.prenom}">
    </option>
  </select>
</div>

<div class="form-group">
<label for="passwordInput">Mot de passe</label>
<input id="passwordInput" name="mdp" class="form-control" type="password" placeholder="123" required>
</div>

<p id="loginError" class="login-error" role="alert"></p>

<button class="btn btn-primary btn-full" type="submit">Se connecter</button>

<p class="login-note">Utilisez vos identifiants réels. Exemple de mot de passe : <strong>123</strong></p>
</form>
</section>

<script src="assets/js/login.js"></script>
</body>
</html>
