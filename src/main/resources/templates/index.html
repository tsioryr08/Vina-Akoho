<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VINA AKOHO - Connexion</title>
<!-- <link rel="stylesheet" th:href="@{/static/css/style.css}"> -->
 <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="login-page">
<section class="login-card">
<div class="login-brand">
<!-- <img th:src="@{/static/VINA_AKOHO_LOGO.png}" alt="VINA AKOHO" class="brand-logo"> -->
 <img th:src="@{/VINA_AKOHO_LOGO.png}" alt="VINA AKOHO" class="brand-logo">
<div>
<h1>VINA AKOHO</h1>
<p>Production et livraison d’aliments pour poulets</p>
</div>
</div>

<form id="loginForm" class="login-form" action="/api/login" method="post" autocomplete="off">
<div class="form-group">
  <label for="employeSelect">Employe</label>
  <select id="employeSelect" name="email" class="form-control" required>
    <option value="" disabled selected> choisis qui es-tu ? </option>
    <option th:each="e : ${employes}" th:value="${e.email}" th:text="${e.nom + ' ' + e.prenom}">
    </option>
  </select>
</div>

<div class="form-group">
<label for="passwordInput">Mot de passe</label>
<input id="passwordInput" name="mdp" class="form-control" type="password" placeholder="md[123" required>
</div>

<p id="loginError" class="login-error" role="alert" th:text="${erreur}"></p>

<button class="btn btn-primary btn-full" type="submit">Se connecter</button>

<p class="login-note">Utilisez vos identifiants réels.</p>
</form>
</section>

<!-- <script th:src="@{/static/assets/js/login.js}"></script> -->
 <script th:src="@{/assets/js/login.js}"></script>
</body>
</html>
