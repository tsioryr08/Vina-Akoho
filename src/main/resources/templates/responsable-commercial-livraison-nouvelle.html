<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VINA AKOHO - Nouvelle livraison</title>
<link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="vina-body">
    <div id="vina-sidebar"></div>
    <div class="app-main-wrapper">
        <div id="vina-header"></div>
        <div id="vina-content">
<section class="page-header">
<div>
<p class="eyebrow">RO04 - Responsable Commercial</p>
<h1>Nouvelle livraison</h1>
<p>
Planifiez une expédition à partir d'une commande en attente.
</p>
</div>
<span class="role-badge">Préparation tournée</span>
</section>

<section class="form-card">
<div class="form-grid">
<div class="field field-full">
<label for="deliveryAddress">Adresse</label>
<input
id="deliveryAddress"
class="form-control"
type="text"
value="Lot ITH 88 bis"
/>
</div>

<div class="field">
<label for="deliveryDriver">Livreur</label>
<select id="deliveryDriver" class="form-control">
<option selected>Rabe</option>
<option>Miaro</option>
<option>Jean</option>
</select>
</div>

<div class="field">
<label for="deliveryOrder">Commande</label>
<select id="deliveryOrder" class="form-control">
<option selected>C0005</option>
<option>C004</option>
<option>C006</option>
<option>C007</option>
</select>
</div>

<div class="field">
<label for="deliveryDate">Date</label>
<input
id="deliveryDate"
class="form-control"
type="date"
value="2015-05-25"
/>
</div>

<div class="field">
<label for="deliveryStatus">Statut</label>
<select id="deliveryStatus" class="form-control">
<option selected>En attente</option>
<option>En cours</option>
<option>Livrée</option>
<option>Annulée</option>
</select>
</div>

<div class="field field-full">
<label for="deliveryComment">Commentaire / Observation</label>
<textarea
id="deliveryComment"
class="form-control textarea"
rows="5"
placeholder="Consignes particulières de livraison"
></textarea>
</div>
</div>

<div class="card-actions">
<a class="btn btn-green" href="#">Enregistrer</a>
<a class="btn btn-ghost" href="livraisons.html">Annuler</a>
</div>
</section>
            <div id="vina-footer"></div>
        </div>
    </div>
<script src="../assets/js/auth.js"></script>
<script src="../assets/js/app-shell.js"></script>
</div>
</body>
</html>
