<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facture</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;color:#333}
        .card{border:1px solid #eee;padding:16px;border-radius:6px}
    </style>
</head>
<body>
    <div class="card">
        <h3>Facture</h3>
        <p>Bonjour <span th:text="${vente.clientNom}"></span>,</p>
        <p>Merci pour votre commande. Vous trouverez ci-joint le récapitulatif de votre facture <strong th:text="${facture.numero}"></strong>.</p>
        <table style="width:100%;border-collapse:collapse">
            <thead>
                <tr><th align="left">Produit</th><th align="right">Quantité</th><th align="right">Total</th></tr>
            </thead>
            <tbody>
                <tr th:each="l : ${vente.lignes}">
                    <td th:text="${l.nomProduit}"></td>
                    <td align="right" th:text="${l.quantite}"></td>
                    <td align="right" th:text="${#numbers.formatDecimal(l.montant,0,'COMMA',2,'POINT')} + ' Ar'"></td>
                </tr>
            </tbody>
        </table>
        <p style="text-align:right;font-weight:700">Total: <span th:text="${#numbers.formatDecimal(facture.montantTtc,0,'COMMA',2,'POINT')} + ' Ar'"></span></p>
        <p>Bien cordialement,<br/>L'équipe VINA AKOHO</p>
    </div>
</body>
</html>
