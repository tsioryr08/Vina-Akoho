<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recette - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="vina-body">
<div id="vina-sidebar" th:replace="${sidebarTemplate} :: sidebar"></div>
<div class="app-main-wrapper">
    <div id="vina-header" th:replace="~{layout/header}"></div>

    <div id="vina-content">
        <section class="page-header">
            <div>
                <h1>Recette — <span th:text="${categorie.libelle}">Poussin</span></h1>
                <p class="muted-text">Composition en matieres premieres de cette gamme de produit.</p>
            </div>
            <a class="btn btn-white" th:href="@{/api/categories/{id}(id=${categorie.id})}">&larr; Retour a la categorie</a>
        </section>

        <div id="recette-message"></div>

        <section class="card">
            <div class="card-header">
                <h3 class="card-title">Composition</h3>
                <p class="card-subtitle">Ajoutez une ou plusieurs matieres premieres et leur quantite necessaire.</p>
            </div>

            <form id="recette-form">
                <div id="lignes-recette"></div>

                <button type="button" id="ajouter-ligne" class="btn btn-outline">+ Ajouter une matiere premiere</button>

                <div class="form-actions" style="margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">Enregistrer la recette</button>
                </div>
            </form>
        </section>
    </div>
</div>

<!-- Template pour une ligne de recette (cache, clone en JS) -->
<template id="ligne-template">
    <div class="form-row ligne-recette" style="align-items:flex-end;">
        <div class="form-group" style="flex:2;">
            <label class="form-label">Matiere premiere</label>
            <select class="form-control mp-select" required>
                <option value="" disabled selected>Chargement...</option>
            </select>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Quantite</label>
            <input type="number" step="0.001" min="0.001" class="form-control quantite-input" required>
        </div>
        <div class="form-group" style="flex:1;">
            <label class="form-label">Unite</label>
            <select class="form-control unite-select" required>
                <option value="" disabled selected>--</option>
                <option th:each="u : ${unites}" th:value="${u.id}" th:text="${u.libelle}"></option>
            </select>
        </div>
        <div class="form-group">
            <button type="button" class="btn btn-delete supprimer-ligne">Retirer</button>
        </div>
    </div>
</template>

<script th:inline="javascript">
    const idCategorie = /*[[${categorie.id}]]*/ 0;
    const lignesContainer = document.getElementById('lignes-recette');
    const template = document.getElementById('ligne-template');
    const messageBox = document.getElementById('recette-message');
    let matieresPremieres = [];

    // 1. Charger la liste des matieres premieres disponibles (AJAX)
    async function chargerMatieresPremieres() {
        const response = await fetch('/api/matieres-premieres/data');
        const body = await response.json();
        matieresPremieres = body.data || [];
    }

    function remplirSelectMp(select, valeurSelectionnee) {
        select.innerHTML = '<option value="" disabled>Choisir...</option>';
        matieresPremieres.forEach(mp => {
            const opt = document.createElement('option');
            opt.value = mp.id;
            opt.textContent = mp.nom;
            if (valeurSelectionnee && Number(valeurSelectionnee) === mp.id) {
                opt.selected = true;
            }
            select.appendChild(opt);
        });
        if (!valeurSelectionnee) select.selectedIndex = 0;
    }

    function ajouterLigne(ligne) {
        const clone = template.content.cloneNode(true);
        const mpSelect = clone.querySelector('.mp-select');
        const quantiteInput = clone.querySelector('.quantite-input');
        const uniteSelect = clone.querySelector('.unite-select');

        remplirSelectMp(mpSelect, ligne ? ligne.idMp : null);
        if (ligne) {
            quantiteInput.value = ligne.quantiteMp;
            uniteSelect.value = ligne.idUnite;
        }

        clone.querySelector('.supprimer-ligne').addEventListener('click', (e) => {
            e.target.closest('.ligne-recette').remove();
        });

        lignesContainer.appendChild(clone);
    }

    // 2. Charger la recette active existante (AJAX) — si aucune, formulaire vide
    async function chargerRecetteActive() {
        const response = await fetch(`/api/recettes/categorie/${idCategorie}`);
        if (response.status === 404) {
            ajouterLigne(null); // pas de recette encore : une ligne vide pour commencer
            return;
        }
        const body = await response.json();
        (body.data || []).forEach(ligne => ajouterLigne(ligne));
    }

    document.getElementById('ajouter-ligne').addEventListener('click', () => ajouterLigne(null));

    // 3. Soumission du formulaire en AJAX (POST JSON, sans rechargement de page)
    document.getElementById('recette-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    const submitButton = event.target.querySelector('button[type="submit"]');
    if (submitButton.disabled) return;   // 👈 bloque un double-clic immédiat
    submitButton.disabled = true;
    submitButton.textContent = 'Enregistrement...';

    const lignes = Array.from(document.querySelectorAll('.ligne-recette')).map(row => ({
        idMp: Number(row.querySelector('.mp-select').value),
        quantiteMp: String(row.querySelector('.quantite-input').value),
        idUnite: Number(row.querySelector('.unite-select').value)
    }));

    if (lignes.length === 0) {
        afficherMessage('Ajoutez au moins une matiere premiere.', 'error');
        submitButton.disabled = false;
        submitButton.textContent = 'Enregistrer la recette';
        return;
    }

    try {
        const response = await fetch('/api/recettes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ idCategorie: idCategorie, lignes: lignes })
        });
        const body = await response.json();

        if (!response.ok || !body.success) {
            afficherMessage(body.message || 'Erreur lors de l\'enregistrement.', 'error');
            return;
        }

        afficherMessage('Recette enregistree avec succes.', 'success');
    } catch (err) {
        afficherMessage('Erreur reseau, veuillez reessayer.', 'error');
    } finally {
        submitButton.disabled = false;              // 👈 réactivé après la réponse
        submitButton.textContent = 'Enregistrer la recette';
    }
}); 

    function afficherMessage(texte, type) {
        messageBox.innerHTML = `<div class="info-banner ${type}">${texte}</div>`;
        messageBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Initialisation
    (async function init() {
        await chargerMatieresPremieres();
        await chargerRecetteActive();
    })();
</script>
</body>
</html>
