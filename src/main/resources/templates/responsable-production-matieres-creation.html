<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Création Nouvel Article - VINA AKOHO</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="vina-body">
    <div id="vina-sidebar"></div>
    <div class="app-main-wrapper">
        <div id="vina-header"></div>
        <div id="vina-content">
            
            <section class="page-header theme-orange">
                <div>
                    <p class="eyebrow">DIRECtION PRODUCTION</p>
                    <h1>Création d'un nouvel Article au Catalogue</h1>
                    <p class="muted-text">Enregistrez un nouvel aliment produit pour le suivi des stocks et la vente.</p>
                </div>
            </section>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Informations de l'Article</h2>
                </div>
                <div style="padding: 24px;">
                    <form onsubmit="event.preventDefault(); alert('L\'article a été enregistré avec succès !'); history.back();">
                        <div class="form-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                            <div class="form-group">
                                <label class="form-label">Code Article Unique *</label>
                                <input type="text" class="form-control" placeholder="ex: ART-CROIS-30" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nom Commercial *</label>
                                <input type="text" class="form-control" placeholder="ex: Aliment Croissance Premium" required>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Type d'Aliment *</label>
                                <select class="form-control" required>
                                    <option value="" selected disabled>Choisir le type d'aliment</option>
                                    <option value="demarrage">Démarrage</option>
                                    <option value="croissance">Croissance</option>
                                    <option value="finition">Finition</option>
                                    <option value="ponte">Ponte</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Conditionnement (kg)</label>
                                <input type="number" class="form-control" value="50">
                            </div>
                        </div>

                        <div class="form-actions" style="margin-top: 32px;">
                            <button type="button" class="btn btn-white" onclick="history.back()">Annuler</button>
                            <button type="submit" class="btn btn-orange">Enregistrer l'Article</button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="vina-footer"></div>
        </div>

        <script src="../assets/js/auth.js"></script>
        <script src="../assets/js/app-shell.js"></script>
    </div>
</body>
</html>
