<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${produitId == null}">Nouveau Produit - VINA AKOHO</title>
    <title th:if="${produitId != null}">Modifier Produit - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="vina-body" xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{layout/sidebar::sidebar}"></div>
<div class="sidebar-backdrop" id="vina-sidebar-backdrop"></div>
<div class="app-main-wrapper">
     <header th:replace="~{layout/header-produit :: header}"></header>
    <div id="vina-header"></div>
    <div id="vina-content">

        <section class="page-header theme-orange">
            <div>
                <p class="eyebrow">ADMINISTRATION</p>
                <h1 th:if="${produitId == null}">Nouveau Produit</h1>
                <h1 th:if="${produitId != null}">Modifier le Produit</h1>
                <p class="muted-text">Remplissez le formulaire ci-dessous pour
                    <span th:if="${produitId == null}">ajouter un nouveau produit</span>
                    <span th:if="${produitId != null}">modifier le produit</span>.
                </p>
            </div>
        </section>

        <div th:if="${success}" class="info-banner success" th:text="${success}"></div>
        <div th:if="${error}" class="info-banner error" th:text="${error}"></div>

        <div class="form-container">
            <form th:action="${produitId == null} ? @{/api/produits} : @{/api/produits/{id}(id=${produitId})}"
                  th:method="${produitId == null} ? 'post' : 'post'"
                  th:object="${produit}">

                <div class="form-grid">
                    <div class="field ref-field">
                        <label for="ref">Référence *</label>
                        <input type="text" id="ref" th:field="*{ref}" placeholder="Ex: REF-001"
                               th:classappend="${#fields.hasErrors('ref')} ? 'error' : ''">
                        <div class="error" th:if="${#fields.hasErrors('ref')}" th:errors="*{ref}"></div>
                        <div class="help-text">Code unique du produit</div>
                    </div>

                    <div class="field nom-field">
                        <label for="nom">Désignation *</label>
                        <input type="text" id="nom" th:field="*{nom}" placeholder="Ex: Aliment Démarrage Poulet 25kg"
                               th:classappend="${#fields.hasErrors('nom')} ? 'error' : ''">
                        <div class="error" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                    </div>

                    <div class="field cat-field">
                        <label for="idCategorie">Catégorie *</label>
                        <select id="idCategorie" th:field="*{idCategorie}"
                                th:classappend="${#fields.hasErrors('idCategorie')} ? 'error' : ''">
                            <option value="">-- Sélectionner une catégorie --</option>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.libelle}">
                            </option>
                        </select>
                        <div class="error" th:if="${#fields.hasErrors('idCategorie')}" th:errors="*{idCategorie}"></div>
                    </div>

                    <div class="field prix-field">
                        <label for="prixVente">Prix de vente (Ar) *</label>
                        <input type="number" id="prixVente" th:field="*{prixVente}"
                               step="0.01" min="0" placeholder="Ex: 45000.00"
                               th:classappend="${#fields.hasErrors('prixVente')} ? 'error' : ''">
                        <div class="error" th:if="${#fields.hasErrors('prixVente')}" th:errors="*{prixVente}"></div>
                    </div>

                    <div class="field seuil-field">
                        <label for="seuilAlerte">Seuil d'alerte</label>
                        <input type="number" id="seuilAlerte" th:field="*{seuilAlerte}"
                               min="0" placeholder="Ex: 50"
                               th:classappend="${#fields.hasErrors('seuilAlerte')} ? 'error' : ''">
                        <div class="error" th:if="${#fields.hasErrors('seuilAlerte')}" th:errors="*{seuilAlerte}"></div>
                        <div class="help-text">Quantité minimale avant alerte (optionnel)</div>
                    </div>
                </div>

                <div class="field field-full desc-field">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}"
                              placeholder="Description détaillée du produit..."
                              th:classappend="${#fields.hasErrors('description')} ? 'error' : ''"></textarea>
                    <div class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></div>
                </div>

                <div class="field field-full stat-field" th:if="${produitId != null}">
                    <label>Statut</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="actif" th:field="*{actif}" />
                        <label for="actif">Produit actif</label>
                    </div>
                    <div class="help-text">Décochez pour désactiver le produit (soft delete)</div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <span th:if="${produitId == null}">➕ Créer</span>
                        <span th:if="${produitId != null}">💾 Mettre à jour</span>
                    </button>
                    <a th:href="@{/api/produits}" class="btn btn-secondary">↩️ Annuler</a>
                </div>
            </form>
        </div>

        <div id="vina-footer"></div>
    </div>

    <script src="/static/assets/js/auth.js"></script>
    <script src="/static/assets/js/app-shell.js"></script>
</div>
</body>
</html>
