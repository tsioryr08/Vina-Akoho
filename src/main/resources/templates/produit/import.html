<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Import Produits - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/static/css/style.css}" />
  </head>
  <body class="vina-body">
    <div th:replace="${sidebarTemplate} :: sidebar"></div>
    <div class="app-main-wrapper">
      <header th:replace="~{layout/header :: header}"></header>
      <div id="vina-content">
        <section class="page-header theme-orange">
          <div>
            <p class="eyebrow">PRODUITS</p>
            <h1>Import en masse</h1>
            <p class="muted-text">Importer plusieurs produits depuis un fichier Excel.</p>
          </div>
        </section>

        <div th:replace="~{layout/fragment-import-excel :: formulaireImport('formImportProduit', 'inputFichierProduit', 'resultatImportProduit', @{/api/produits/import/modele})}"></div>
      </div>
    </div>

    <script th:src="@{/js/import-excel.js}"></script>
    <script th:inline="javascript">
      initImportExcel({
        urlApercu: /*[[@{/api/produits/import/apercu}]]*/ "",
        urlImport: /*[[@{/api/produits/import}]]*/ "",
        inputFileId: "inputFichierProduit",
        formId: "formImportProduit",
        resultatContainerId: "resultatImportProduit",
      });
    </script>
  </body>
</html>
