<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINA AKOHO - Statistiques Livraisons</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stats-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-top: 20px; }
        .chart-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .stat-big-number { font-size: 3em; font-weight: bold; color: #2c3e50; text-align: center; padding: 40px 0; }
    </style>
</head>
<body class="vina-body">
<div th:replace="${sidebarTemplate} :: sidebar"></div>

<div class="app-main-wrapper">
    <div id="vina-header" th:replace="${headerTemplate} :: header"></div>

    <div id="vina-content">
        <section class="page-header">
            <div>
                <p class="eyebrow">Livraisons</p>
                <h1>Statistiques des Livraisons</h1>
                <p>Analyse de la répartition des livraisons par zone.</p>
            </div>
        </section>

        <div class="stats-grid">
            <section class="chart-card">
                <h3>Répartition par Zone</h3>
                <canvas id="zoneChart" style="max-height: 300px;"></canvas>
            </section>

            <section class="chart-card">
                <h3>Total Livraisons</h3>
                <div id="totalLivraisons" class="stat-big-number">--</div>
            </section>
        </div>
    </div>
</div>

<script th:src="@{/js/auth.js}"></script>
<script th:src="@{/js/app-shell.js}"></script>

<script>
    async function loadStats() {
        try {
            // Fetch données zones
            const zRes = await fetch('/api/statistiques/livraisons/zones');
            const zoneData = await zRes.json();

            // Fetch total
            const tRes = await fetch('/api/statistiques/livraisons/total');
            const total = await tRes.text();

            // Affichage du total
            document.getElementById('totalLivraisons').innerText = total;

            // Création du graphique
            new Chart(document.getElementById('zoneChart').getContext('2d'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(zoneData),
                    datasets: [{
                        data: Object.values(zoneData),
                        backgroundColor: ['#4e73df', '#1cc88a', '#36b9cc', '#f6c23e', '#e74a3b']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        } catch (e) {
            console.error("Erreur chargement:", e);
        }
    }
    document.addEventListener('DOMContentLoaded', loadStats);
</script>
</body>
</html>
