<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VINA AKOHO - Détail livraison</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="vina-body">
    <div th:replace="${sidebarTemplate} :: sidebar"></div>
    <div class="app-main-wrapper">
        <div id="vina-header" th:replace="${headerTemplate} :: header"></div>
        <div id="vina-content">
            <section class="page-header">
                <div>
           
                    <h1>Détail de la livraison #<span th:text="${livraison.id}">1</span></h1>
                </div>
            </section>

            <div th:if="${success}" class="info-banner success" th:text="${success}"></div>
            <div th:if="${error}" class="info-banner error" th:text="${error}"></div>

            <section class="form-card">
                <div class="form-section">
                    <div class="form-section-heading">
                        <span>1</span>
                        <div>
                            <h2>Informations générales</h2>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="field">
                            <label>Vente</label>
                            <input class="form-control" type="text" th:value="${livraison.referenceVente}" readonly>
                        </div>
                        <div class="field">
                            <label>Client</label>
                            <input class="form-control" type="text" th:value="${livraison.clientNom + ' ' + livraison.clientPrenom}" readonly>
                        </div>
                        <div class="field">
                            <label>Livreur</label>
                            <input class="form-control" type="text" th:value="${livraison.livreurNom != null ? livraison.livreurNom + ' ' + livraison.livreurPrenom : '-'}" readonly>
                        </div>
                        <div class="field">
                            <label>Statut</label>
                            <input class="form-control" type="text" th:value="${livraison.statutLivraison}" readonly>
                        </div>
                        <div class="field">
                            <label>Lieu exact</label>
                            <input class="form-control" type="text" th:value="${livraison.lieuExact}" readonly>
                        </div>
                        <div class="field">
                            <label>Contact</label>
                            <input class="form-control" type="text" th:value="${livraison.contact}" readonly>
                        </div>
                        <div class="field">
                            <label>Date de livraison</label>
                            <input class="form-control" type="text" th:value="${livraison.dateLivraison}" readonly>
                        </div>
                        <div class="field field-full">
                            <label>Commentaire</label>
                            <textarea class="form-control textarea" rows="5" readonly th:text="${livraison.commentaire}"></textarea>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-heading">
                        <span>2</span>
                        <div>
                            <h2>Modifier le statut</h2>
                        </div>
                    </div>
                    <form class="form-grid" th:action="@{/api/livraisons/{id}/statut(id=${livraison.id})}" method="post">
                        <div class="field field-full">
                            <label for="nouveauStatut">Nouveau statut</label>
                            <select id="nouveauStatut" name="nouveauStatut" class="form-control" required th:disabled="${statutEstLivre}">
                                <option value="">Sélectionner un statut</option>
                                <option th:each="statut : ${statutsDisponibles}"
                                        th:value="${statut.libelle}"
                                        th:text="${statut.libelle}"></option>
                            </select>
                            <small th:if="${statutEstLivre}" class="muted-text">Le statut est verrouillé car la livraison est déjà livrée.</small>
                        </div>
                        <div class="form-actions field-full">
                            <button type="submit" class="btn btn-green" th:disabled="${statutEstLivre}">Mettre à jour</button>
                        </div>
                    </form>
                </div>

                <div class="form-section">
                    <div class="form-section-heading">
                        <span>3</span>
                        <div>
                            <h2>Historique des statuts</h2>
                        </div>
                    </div>
                    <div class="table-card">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Ancien statut</th>
                                    <th>Nouveau statut</th>
                                    <th>Date</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="changement : ${historiquesLivraison}">
                                    <td th:text="${changement.ancienStatut ?: '-'}">-</td>
                                    <td th:text="${changement.nouveauStatut}">En préparation</td>
                                    <td th:text="${changement.dateChangement}">2026-01-01</td>
                                </tr>
                                <tr th:if="${historiquesLivraison.isEmpty()}">
                                    <td colspan="3" class="muted-text">Aucun changement de statut enregistré.</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="form-actions">
                    <a class="btn btn-primary" th:href="@{/api/livraisons}">Retour à la liste</a>
                </div>
            </section>
            <div id="vina-footer"></div>
        </div>
    </div>
    <script th:src="@{/static/assets/js/auth.js}"></script>
    <script th:src="@{/static/assets/js/app-shell.js}"></script>
<script th:src="@{/js/script_content.js}"></script>
</body>
</html>
