<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registre des Dépenses - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="page-comptable-depenses">
    <div th:replace="${sidebarTemplate} :: sidebar"></div>

    <div class="sidebar-backdrop" id="vina-sidebar-backdrop"></div>

    <div class="main">
      <div id="vina-header" th:replace="~{layout/header}"></div>

      <div class="content">
        <section class="page-header">
          <div>
    
            <h1>Registre des Dépenses</h1>
            <p>
              Journal de saisie et de contrôle de toutes les sorties d’argent de
              l’entreprise.
            </p>
          </div>
          <div class="header-actions">
            <a
              class="btn btn-primary"
              th:href="@{/api/depenses/comptable-depenses-nouveau}"
              >+ Nouvelle dépense</a
            >
          </div>
        </section>
        <section class="stats-grid">
          <article class="stat-card">
            <div class="stat-label" th:text="'Total dépenses — ' + ${dateDuJour}">
              Total
            </div>
            <div
              class="stat-value text-danger"
              th:text="${#numbers.formatDecimal(montantTotalDepenses, 0, 'COMMA', 2, 'POINT')} + ' Ar'"
            >
              0 Ar
            </div>
          </article>
          <article class="stat-card">
            <div
              class="stat-label"
              th:text="${categorieDepense1.libelle}"
            ></div>
            <div
              class="stat-value text-danger"
              th:text="${#numbers.formatDecimal(montantCategorieDepense1, 0, 'COMMA', 2, 'POINT')} + ' Ar'"
            >
              0 Ar
            </div>
          </article>
          <article class="stat-card">
            <div
              class="stat-label"
              th:text="${categorieDepense2.libelle}"
            ></div>
            <div
              class="stat-value text-danger"
              th:text="${#numbers.formatDecimal(montantCategorieDepense2, 0, 'COMMA', 2, 'POINT')} + ' Ar'"
            >
              0 Ar
            </div>
          </article>
          <article class="stat-card">
            <div
              class="stat-label"
              th:text="${categorieDepense3.libelle}"
            ></div>
            <div
              class="stat-value text-danger"
              th:text="${#numbers.formatDecimal(montantCategorieDepense3, 0, 'COMMA', 2, 'POINT')} + ' Ar'"
            >
              0 Ar
            </div>
          </article>
        </section>

        <section class="card">
          <div class="card-header">
            <h2 class="card-title">Filtres et Recherche</h2>
          </div>
          <form
            th:action="@{/api/depenses/recherche}"
            method="get"
            class="ventes-filter-form"
          >
            <div class="form-row">
              <div class="form-group" style="grid-column: 1 / -1;">
                <label class="form-label">Mot-clé</label>
                <input
                  class="form-control"
                  type="text"
                  name="motCle"
                  placeholder="Rechercher..."
                  th:value="${motCle != null ? motCle : ''}"
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Catégorie</label>
                <select class="form-control" name="idCategorie">
                  <option value="">Toutes les catégories</option>
                  <option
                    th:each="categorie : ${categoriesDepense}"
                    th:value="${categorie.id}"
                    th:text="${categorie.libelle}"
                    th:selected="${idCategorie != null and idCategorie == categorie.id}"
                  ></option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Période (Du)</label>
                <input
                  class="form-control"
                  type="date"
                  name="dateDu"
                  th:value="${dateDu != null ? dateDu : ''}"
                />
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="depTriPar">Trier par</label>
                <select id="depTriPar" class="form-control">
                  <option value="0">Date</option>
                  <option value="1">Désignation</option>
                  <option value="2">Catégorie</option>
                  <option value="3">Montant</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="depOrdreTri">Ordre</label>
                <select id="depOrdreTri" class="form-control">
                  <option value="desc">Décroissant</option>
                  <option value="asc">Croissant</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label" for="depTaille">Éléments par page</label>
                <input
                  id="depTaille"
                  type="number"
                  class="form-control"
                  value="10"
                  min="1"
                  max="200"
                />
              </div>
            </div>
            <div class="form-actions">
              <a
                th:href="@{/api/depenses/comptable-depenses}"
                class="btn btn-outline"
              >
                Réinitialiser
              </a>
              <button type="submit" class="btn btn-primary">Appliquer les filtres</button>
            </div>
          </form>
        </section>

        <section class="card depense-register-card">
          <div class="card-header">
            <h2 class="card-title">Registre des Opérations</h2>
          </div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Désignation</th>
                  <th>Catégorie</th>
                  <th>Montant</th>
                  <th>Statut</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="depense : ${depenses}">
                  <td th:text="${depense.date}"></td>
                  <td th:text="${depense.designation}"></td>
                  <td>
                    <span
                      class="badge badge-info"
                      th:text="${depense.libelleCategorieDepense}"
                    ></span>
                  </td>
                  <td
                    class="text-danger fw-bold"
                    th:text="${depense.montant + ' Ar'}"
                  ></td>
                  <td>
                    <span
                      class="badge badge-warning"
                      th:text="${depense.libelleStatutDepense}"
                    ></span>
                  </td>
                  <td>
                    <a
                      th:href="@{/api/depenses/comptable-depenses-nouveau(depenseId=${depense.id})}"
                      class="btn btn-small btn-ghost"
                      >✎</a
                    >
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="pagination" id="depensesPagination"></div>
        </section>

        <div id="vina-footer"></div>
      </div>
      <script src="/assets/js/script_content.js"></script>
    <script>
      (function () {
        const tbody = document.querySelector(
          "#vina-content .depense-register-card tbody",
        );
        if (!tbody) return;
        const rows = Array.from(tbody.querySelectorAll("tr"));
        const triPar = document.getElementById("depTriPar");
        const ordreTri = document.getElementById("depOrdreTri");
        const tailleInput = document.getElementById("depTaille");
        const pagination = document.getElementById("depensesPagination");
        let currentPage = 1;

        function cellValue(row, col) {
          const cell = row.children[col];
          if (!cell) return "";
          let text = cell.textContent.trim();
          if (col === 3) {
            const n = parseFloat(text.replace(/[^\d.-]/g, ""));
            return isNaN(n) ? 0 : n;
          }
          return text.toLowerCase();
        }

        function render() {
          const col = parseInt(triPar ? triPar.value : "0", 10);
          const desc = ordreTri && ordreTri.value === "desc";
          const sorted = rows.slice().sort((a, b) => {
            const va = cellValue(a, col);
            const vb = cellValue(b, col);
            if (va < vb) return desc ? 1 : -1;
            if (va > vb) return desc ? -1 : 1;
            return 0;
          });

          const taille = Math.max(
            1,
            parseInt(tailleInput ? tailleInput.value : "10", 10) || 10,
          );
          const totalPages = Math.max(1, Math.ceil(sorted.length / taille));
          if (currentPage > totalPages) currentPage = totalPages;
          const start = (currentPage - 1) * taille;
          const end = start + taille;

          rows.forEach((r) => (r.style.display = "none"));
          sorted.slice(start, end).forEach((r) => (r.style.display = ""));

          pagination.innerHTML = "";
          if (totalPages <= 1) return;
          const info = document.createElement("span");
          info.className = "pagination-info";
          info.textContent =
            "Page " + currentPage + " / " + totalPages + " (" + sorted.length + " éléments)";
          pagination.appendChild(info);

          const nav = document.createElement("div");
          nav.className = "pagination-controls";

          const prev = document.createElement("button");
          prev.className = "btn btn-sm btn-outline";
          prev.textContent = "← Précédent";
          prev.disabled = currentPage === 1;
          prev.addEventListener("click", () => {
            if (currentPage > 1) {
              currentPage--;
              render();
            }
          });
          nav.appendChild(prev);

          for (let i = 1; i <= totalPages; i++) {
            const btn = document.createElement("button");
            btn.className =
              i === currentPage ? "btn btn-sm btn-primary active" : "btn btn-sm btn-ghost";
            btn.textContent = i;
            btn.addEventListener("click", () => {
              currentPage = i;
              render();
            });
            nav.appendChild(btn);
          }

          const next = document.createElement("button");
          next.className = "btn btn-sm btn-outline";
          next.textContent = "Suivant →";
          next.disabled = currentPage === totalPages;
          next.addEventListener("click", () => {
            if (currentPage < totalPages) {
              currentPage++;
              render();
            }
          });
          nav.appendChild(next);

          pagination.appendChild(nav);
        }

        [triPar, ordreTri, tailleInput].forEach((c) => {
          if (!c) return;
          c.addEventListener("change", () => {
            currentPage = 1;
            render();
          });
          c.addEventListener("input", () => {
            currentPage = 1;
            render();
          });
        });

        render();
      })();
    </script>
  </body>
</html>
