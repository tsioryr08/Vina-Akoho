<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>VINA AKOHO - Dashboard Financier</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .finance-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-top: 20px; }
        .kpi-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .kpi-value { font-size: 1.8em; font-weight: bold; color: #2c3e50; margin-top: 10px; }
        .kpi-label { color: #7f8c8d; font-size: 0.9em; text-transform: uppercase; }
        .chart-card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="vina-body">
<div th:replace="~{layout/sidebar-livraison::sidebar-livraison}"></div>
<div class="app-main-wrapper">
    <div id="vina-header" th:replace="~{layout/header}"></div>

    <div id="vina-content">
        <section class="page-header">
            <h1>Tableau de bord Financier</h1>
        </section>

        <div class="finance-grid" style="grid-template-columns: repeat(3, 1fr);">
            <div class="kpi-card"><div class="kpi-label">Total Recettes</div><div id="kpi-recettes" class="kpi-value">0 Ar</div></div>
            <div class="kpi-card"><div class="kpi-label">Total Dépenses</div><div id="kpi-depenses" class="kpi-value">0 Ar</div></div>
            <div class="kpi-card"><div class="kpi-label">Bénéfice Net</div><div id="kpi-benefice" class="kpi-value" style="color: #1cc88a;">0 Ar</div></div>
        </div>

        <div class="finance-grid">
            <section class="chart-card"><h3>Dépenses par Catégorie</h3><canvas id="catChart" height="150"></canvas></section>
            <section class="chart-card"><h3>Dépenses par Phase</h3><canvas id="phaseChart" height="150"></canvas></section>
            <section class="chart-card"><h3>Recettes Mensuelles</h3><canvas id="recettesChart" height="150"></canvas></section>
            <section class="chart-card"><h3>Évolution Bénéfice</h3><canvas id="beneficeChart" height="150"></canvas></section>
        </div>
    </div>
</div>

<script th:src="@{/static/assets/js/app-shell.js}"></script>
<script>
    async function loadFinanceCharts() {
        try {
            const [cat, phase, recettes, benefice] = await Promise.all([
                fetch('/api/finances-statistique/depenses-categorie').then(r => r.json()),
                fetch('/api/finances-statistique/depenses-phase').then(r => r.json()),
                fetch('/api/finances-statistique/recettes-mensuelles').then(r => r.json()),
                fetch('/api/finances-statistique/evolution-benefice').then(r => r.json())
            ]);

            const sumRecettes = Object.values(recettes).reduce((a, b) => a + b, 0);
            const sumDepenses = Object.values(cat).reduce((a, b) => a + b, 0);
            document.getElementById('kpi-recettes').innerText = sumRecettes.toLocaleString() + ' Ar';
            document.getElementById('kpi-depenses').innerText = sumDepenses.toLocaleString() + ' Ar';
            document.getElementById('kpi-benefice').innerText = (sumRecettes - sumDepenses).toLocaleString() + ' Ar';

            new Chart(document.getElementById('catChart'), { type: 'pie', data: { labels: Object.keys(cat), datasets: [{ data: Object.values(cat), backgroundColor: ['#4e73df', '#1cc88a', '#f6c23e', '#e74a3b'] }] }});
            new Chart(document.getElementById('phaseChart'), { type: 'bar', data: { labels: Object.keys(phase), datasets: [{ label: 'Ar', data: Object.values(phase), backgroundColor: '#36b9cc' }] }});
            new Chart(document.getElementById('recettesChart'), { type: 'line', data: { labels: Object.keys(recettes), datasets: [{ label: 'Recettes', data: Object.values(recettes), borderColor: '#1cc88a', tension: 0.3, fill: true }] }});
            new Chart(document.getElementById('beneficeChart'), { type: 'line', data: { labels: Object.keys(benefice), datasets: [{ label: 'Bénéfice', data: Object.values(benefice), borderColor: '#f6c23e', backgroundColor: 'rgba(246, 194, 62, 0.2)', tension: 0.3 }] }});

        } catch (e) { console.error("Erreur chargement:", e); }
    }
    document.addEventListener('DOMContentLoaded', loadFinanceCharts);
</script>
</body>
</html>
