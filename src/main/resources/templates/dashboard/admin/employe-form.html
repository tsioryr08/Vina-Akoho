<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${modeEdition} ? 'Modifier un compte - VINA AKOHO' : 'Nouveau compte - VINA AKOHO'">Compte - VINA AKOHO</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>
  <body class="vina-body">
    <div id="vina-sidebar" th:replace="~{layout/admin}"></div>
    <div class="app-main-wrapper">
      <div id="vina-header" th:replace="~{layout/header}"></div>

      <div id="vina-content">
          <section class="page-header">
            <div>
             
              <h1 th:text="${modeEdition} ? 'Modifier un compte employé' : 'Créer un nouveau compte'">Compte employé</h1>
              <p class="muted-text" th:text="${modeEdition} ? 'Modifiez les informations du compte.' : 'Remplissez les informations pour créer un nouveau compte.'"></p>
            </div>
            <div class="header-actions">
              <a class="btn btn-outline" th:href="@{/api/admin/employes}">← Retour à la liste</a>
            </div>
          </section>

          <div id="alerte" class="info-banner error" style="display:none;"></div>
          <div id="succes" class="info-banner success" style="display:none;"></div>

          <section class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title" th:text="${modeEdition} ? 'Informations du compte' : 'Informations du nouveau compte'"></h2>
                <p class="card-subtitle">Tous les champs marqués * sont obligatoires.</p>
              </div>
            </div>

            <div class="flex flex-col gap-4">
              <div class="grid gap-3" style="grid-template-columns: 1fr 1fr;">
                <div class="form-group">
                  <label class="form-label">Nom *</label>
                  <input id="nom" type="text" placeholder="Nom de famille" class="form-control" />
                </div>
                <div class="form-group">
                  <label class="form-label">Prénom *</label>
                  <input id="prenom" type="text" placeholder="Prénom" class="form-control" />
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Email *</label>
                <input id="email" type="email" placeholder="email@vinaakoho.mg" class="form-control" />
              </div>

              <div class="form-group">
                <label class="form-label">Contact</label>
                <input id="contact" type="text" placeholder="+261 34 00 000 00" class="form-control" />
              </div>

              <!-- Mot de passe uniquement en création -->
              <div th:if="${!modeEdition}" class="form-group">
                <label class="form-label">Mot de passe *</label>
                <input id="mdp" type="password" placeholder="Mot de passe" class="form-control" />
              </div>

              <div class="form-group">
                <label class="form-label">Rôle *</label>
                <select id="idRole" class="form-control">
                  <option value="">-- Sélectionner un rôle --</option>
                  <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.poste}"></option>
                </select>
              </div>

              <div class="form-actions justify-end">
                <a class="btn btn-outline" th:href="@{/api/admin/employes}">Annuler</a>
                <button class="btn btn-primary" onclick="soumettre()">
                  <span th:text="${modeEdition} ? 'Enregistrer les modifications' : 'Créer le compte'"></span>
                </button>
              </div>
            </div>
          </section>
      </div>

      <div id="vina-footer" th:replace="~{layout/footer}"></div>
    </div>

    <script th:src="@{/js/auth.js}"></script>
    <script th:src="@{/js/app-shell.js}"></script>
    <script th:src="@{/js/script_content.js}"></script>
    <script th:inline="javascript">
      const modeEdition = /*[[${modeEdition}]]*/ false;
      const idEmploye   = /*[[${idEmploye}]]*/ null;

      // En mode édition, charger les données existantes
      if (modeEdition && idEmploye) {
        fetch(`/api/admin/employes/actifs`)
          .then(r => r.json())
          .then(json => {
            // Chercher dans actifs puis désactivés
            let employe = (json.data || []).find(e => e.id == idEmploye);
            if (employe) remplirFormulaire(employe);
            else {
              return fetch(`/api/admin/employes/desactives`)
                .then(r => r.json())
                .then(j => {
                  const e = (j.data || []).find(e => e.id == idEmploye);
                  if (e) remplirFormulaire(e);
                });
            }
          });
      }

      function remplirFormulaire(e) {
        document.getElementById("nom").value     = e.nom;
        document.getElementById("prenom").value  = e.prenom;
        document.getElementById("email").value   = e.email;
        document.getElementById("contact").value = e.contact ?? "";
        // Sélectionner le bon rôle dans le select
        const sel = document.getElementById("idRole");
        for (let opt of sel.options) {
          if (opt.text === e.role) { opt.selected = true; break; }
        }
      }

      async function soumettre() {
        const nom     = document.getElementById("nom").value.trim();
        const prenom  = document.getElementById("prenom").value.trim();
        const email   = document.getElementById("email").value.trim();
        const contact = document.getElementById("contact").value.trim();
        const idRole  = document.getElementById("idRole").value;

        if (!nom || !prenom || !email || !idRole) {
          afficherAlerte("Veuillez remplir tous les champs obligatoires.");
          return;
        }

        let body, url, method;

        if (modeEdition) {
          body   = { nom, prenom, email, contact: contact || null, idRole: parseInt(idRole) };
          url    = `/api/admin/employes/${idEmploye}`;
          method = "PUT";
        } else {
          const mdp = document.getElementById("mdp").value.trim();
          if (!mdp) { afficherAlerte("Le mot de passe est obligatoire."); return; }
          body   = { nom, prenom, email, contact: contact || null, mdp, idRole: parseInt(idRole) };
          url    = `/api/admin/employes`;
          method = "POST";
        }

        try {
          const rep  = await fetch(url, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body)
          });
          const json = await rep.json();
          if (json.success) {
            afficherSucces(modeEdition ? "Compte modifié avec succès." : "Compte créé avec succès.");
            setTimeout(() => window.location.href = "/api/admin/employes", 1500);
          } else {
            afficherAlerte(json.message);
          }
        } catch (e) {
          afficherAlerte("Erreur lors de l'envoi du formulaire.");
        }
      }

      function afficherAlerte(msg) {
        const el = document.getElementById("alerte");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => el.style.display = "none", 4000);
      }

      function afficherSucces(msg) {
        const el = document.getElementById("succes");
        el.textContent = msg;
        el.style.display = "block";
      }
    </script>
  </body>
</html>
