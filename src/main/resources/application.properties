spring.application.name=vina-akoho
spring.datasource.url=jdbc:postgresql://localhost:5432/vinakoho
spring.datasource.username=vinakoho
spring.datasource.password=vinakoho
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

server.port=8081

# Module F0 Login (Ny Antema)
# IMPORTANT : en production, cette cle ne doit jamais etre commitee en clair.
# dia amle projet,,, on la garde ici par simplicite.
jwt.secret=vinaakoho-secret-key-changer-en-production-2026
jwt.expiration-ms=36000000

# pour les fichier static
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.add-mappings=true
# pour les templatess
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.thymeleaf.check-template-location=true
server.servlet.session.tracking-modes=cookie
